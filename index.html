<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio esercizi di Estimo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px/1.5 Georgia,"Times New Roman",serif;background:#f7f5ef;color:#1f2a1f}iframe{display:block;width:100%;height:100vh;border:0}#status{padding:2rem;max-width:800px;margin:auto}a{color:#2f6b3a}
</style>
</head>
<body>
<div id="status">Caricamento archivio…</div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const response=await fetch('https://raw.githubusercontent.com/matteopandolfi91-glitch/archivio-estimo/493152ec704f8b0ed19e8ebd7b71e9e47b4fa964/index.html');
  if(!response.ok) throw new Error('Impossibile caricare l’archivio degli esercizi.');
  let html=await response.text();
  html=html.replace(/<h2>\$\{e\.i\+1\}\. \$\{esc\(e\.h\)\}<\/h2>/g,'<h2><a href="esercizio-${e.i+1}.html">${e.i+1}. ${esc(e.h)}</a></h2>');
  const frame=document.createElement('iframe');
  frame.title='Elenco degli esercizi di Estimo';
  frame.srcdoc=html;
  document.body.replaceChild(frame,status);
 }catch(error){status.innerHTML='Non è stato possibile caricare l’archivio. Riprova più tardi.<br><small>'+error.message+'</small>';}
})();
</script>
</body>
</html>
